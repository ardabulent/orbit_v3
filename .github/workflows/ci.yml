# ⚠️ **SHA yanındaki sürüm yorumunu Dependabot günceller — o alana insan notu
# yazılmaz.** 2026-09-06'da her satıra "· 2026-09-06'da çözüldü" eklenmişti;
# Dependabot SHA'ları yükseltti ama yorumu tanıyamadığı için olduğu gibi
# bıraktı ve beş sabitlemenin beşinde de yorum yanlış kaldı (#214). Kural:
# `.ai/AGENT_WORKFLOW.md` **K-21**. Aynı biçim diğer iki workflow'da da geçerli.

name: CI Pipeline

on:
  # Hedef dal filtresi bilinçli olarak yok. `branches: [main]` yazıldığında,
  # base'i main olmayan bir PR (yığılı/stacked çalışma) hiçbir kontrol
  # almıyordu — kalite kapısı sessizce devre dışı kalıyordu. Her PR
  # doğrulanmalıdır, hangi dala hedeflenirse hedeflensin.
  pull_request:
  push:
    branches: [main]

# İş yalnızca depoyu okuyor. Diğer iki workflow yetkiyi zaten daraltıyordu;
# bu dosya varsayılan token yetkisiyle koşuyordu (#216).
permissions:
  contents: read

# Aynı dala arka arkaya push edildiğinde eskimiş koşumlar sonuna kadar
# çalışıyordu. `main` üzerinde iptal ETMİYORUZ: zorunlu bir kontrolün merge
# edilmiş bir commit'te iptal edilmiş görünmesi, kapıyı "bekliyor" durumunda
# bırakır.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm kurulumu
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Bağımlılıkları Yükle
        run: pnpm install --frozen-lockfile

      - name: Kod Formatı Kontrolü (Prettier)
        run: pnpm run format:check

      - name: Lint Kontrolü (ESLint)
        run: pnpm run lint

      - name: Tip Kontrolü (Type Check)
        run: pnpm check

      # Edge Function'lar Deno'da çalışıyor ve yukarıdaki `pnpm check`in
      # kapsamı dışında (2026-10-05, kapsamlı analiz 2. madde). Yanlış yazılmış
      # bir alan adı ya da değişen bir imza, fonksiyon o kod yoluna girene kadar
      # görünmezdi; zincir testi fonksiyonun AÇILDIĞINI ölçer, tiplerini değil.
      # Kullanıcı onayıyla eklendi (yeni CI bağımlılığı). Deno sürümü sabit:
      # tip kuralları sürümler arasında değişir, kapı sessizce kaymasın.
      - name: Deno kurulumu
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Edge Function tip kontrolü (Deno)
        run: deno check supabase/functions/*/index.ts

      - name: Birim Testleri Çalıştır
        run: pnpm test

      - name: Lisans Kontrolü
        run: pnpm licenses list --prod --json > licenses.json && node .github/scripts/check-licenses.mjs licenses.json

      # CI derlemesi bir dağıtım değil, bir derleme kontrolüdür ve üretilen paket hiçbir
      # zaman bir yerde servis edilmez. Üretim ortamında değişkenlerin eksik olması build'i
      # düşürdüğü için (K-04), CI ortamında derlemenin geçebilmesi amacıyla açıkça yer tutucu
      # (dummy/placeholder) ortam değişkenleri verilir.
      - name: Build Kontrolü
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      # Kapı yalnızca production bağımlılıklarına uygulanır. ORBIT bir Vite
      # SPA'dır; kullanıcının tarayıcısına ulaşan kod yalnızca production
      # ağacından gelir. devDependencies'teki açıklar CI makinesinde çalışan
      # derleme araçlarını ilgilendirir ve büyük çoğunluğu transitive olduğu
      # için doğrudan kapatılamaz. Tamamını engelleyici yapmak, kapının kalıcı
      # olarak kırmızı kalmasına ve zamanla göz ardı edilmesine yol açardı.
      - name: Bağımlılık Güvenlik Taraması — Production (engelleyici)
        run: pnpm audit --prod --audit-level=high

      # Geliştirme bağımlılıkları engellemez ama görünür kalır; tedarik zinciri
      # riski böylece takip edilebilir.
      - name: Bağımlılık Güvenlik Taraması — Geliştirme (bilgilendirme)
        run: pnpm audit --audit-level=high
        continue-on-error: true
