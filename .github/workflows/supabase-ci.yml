name: Supabase Database Tests

on:
  # Hedef dal filtresi bilinçli olarak yok; bkz. ci.yml'deki aynı not.
  #
  # Yol filtresi de kaldırıldı (2026-08-29). Filtre doğru bir tasarrufdu ama
  # bu işin **zorunlu kontrol** olmasını engelliyordu: yol eşleşmediğinde
  # workflow hiç başlamıyor, GitHub da hiç başlamamış bir zorunlu kontrolü
  # "bekliyor" sayarak merge'ü süresiz bloke ediyor. Tasarruf artık işin
  # içinde: `supabase/` değişmediyse iş saniyeler içinde yeşil biter.
  #
  # Neden #112: `feat/106-create-member` PR'ında bu iş hiç koşmadı ve PR
  # kırık bir pgTAP plan sayısıyla merge edildi.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Aynı dala arka arkaya push edildiğinde eskimiş koşumlar sonuna kadar
# çalışıyordu. `main` üzerinde iptal ETMİYORUZ: zorunlu bir kontrolün merge
# edilmiş bir commit'te iptal edilmiş görünmesi, kapıyı "bekliyor" durumunda
# bırakır.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Supabase GitHub entegrasyonu, main'e merge edilen her migration'ı production
  # veritabanına otomatik uygular. Geçerli ama yıkıcı bir SQL ifadesi gözden
  # kaçarsa veri kaybı geri alınamaz. Bu iş, yalnızca PR'da DEĞİŞEN migration
  # dosyalarını tarar; tüm geçmişi tarasaydı meşru bir yıkıcı migration merge
  # edildiği anda kalıcı olarak kırmızıya dönerdi.
  destructive-migration-guard:
    name: Yıkıcı Migration Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Base ile head arasında diff alabilmek için tam geçmiş gerekiyor.
          fetch-depth: 0

      - name: Değişen migration dosyalarını tara
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- 'supabase/migrations/*.sql' || true)

          if [ -z "$files" ]; then
            echo "Bu PR'da eklenen veya değiştirilen migration dosyası yok."
            exit 0
          fi

          echo "Taranan dosyalar:"
          echo "$files"
          echo

          # Veri kaybına yol açan ifadeler. SQL bu repoda küçük harfle yazıldığı
          # için eşleştirme büyük/küçük harf duyarsızdır.
          blocking='drop[[:space:]]+(table|schema|database)|drop[[:space:]]+column|truncate[[:space:]]|delete[[:space:]]+from'

          # Veriyi silmez ama işlevi sessizce kırabilir. 20260821000000 numaralı
          # migration yerine yenisini koymadan altı policy düşürdüğü için
          # "Belgeler" özelliği production'da hâlâ işlevsiz.
          warning='drop[[:space:]]+policy'

          failed=0

          for f in $files; do
            # İşaretleyici, yorumlar temizlenmeden önce aranır.
            if grep -qiE '^[[:space:]]*--[[:space:]]*ALLOW-DESTRUCTIVE:[[:space:]]*[^[:space:]]' "$f"; then
              reason=$(grep -iE '^[[:space:]]*--[[:space:]]*ALLOW-DESTRUCTIVE:' "$f" | head -1)
              echo "::notice file=$f::Bilinçli yıkıcı migration, kontrol atlanıyor. $reason"
              continue
            fi

            # Satır yorumları temizlenir; aksi halde açıklama metnindeki
            # "DELETE/TRUNCATE" gibi ifadeler sahte alarm üretir. Satır sayısı
            # korunur ki bildirilen satır numaraları doğru kalsın.
            stripped=$(sed 's/--.*$//' "$f")

            hits=$(printf '%s\n' "$stripped" | grep -inE "$blocking" || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::Yıkıcı SQL ifadesi bulundu"
              printf '%s\n' "$hits" | while IFS= read -r line; do
                echo "  $f:$line"
              done
              failed=1
            fi

            warns=$(printf '%s\n' "$stripped" | grep -inE "$warning" || true)
            if [ -n "$warns" ]; then
              echo "::warning file=$f::drop policy bulundu — yerine yeni bir policy eklendiğini doğrulayın, aksi halde özellik sessizce işlevsiz kalır"
              printf '%s\n' "$warns" | while IFS= read -r line; do
                echo "  $f:$line"
              done
            fi
          done

          if [ "$failed" -eq 1 ]; then
            cat <<'MSG'

          ------------------------------------------------------------------
          Bu migration production veritabanına merge ile birlikte otomatik
          uygulanacak ve yukarıdaki ifadeler geri alınamaz veri kaybına yol
          açabilir.

          Yıkıcı işlem gerçekten amaçlanıyorsa, migration dosyasının başına
          gerekçesiyle birlikte şu satırı ekleyin:

            -- ALLOW-DESTRUCTIVE: <neden gerekli olduğunun kısa açıklaması>

          Gerekçe PR açıklamasında da belirtilmeli ve karşı ekip üyesi
          tarafından ayrıca onaylanmalıdır.
          ------------------------------------------------------------------
          MSG
            exit 1
          fi

          echo "Yıkıcı ifade bulunamadı."

  tenant-rls:
    name: Tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Değişen dosyaları tespit edebilmek için geçmiş gerekiyor.
          fetch-depth: 0

      # `supabase start` her koşuda birkaç dakika sürüyor; veritabanına
      # dokunmayan PR'larda bunu ödemeye gerek yok. İş yine de koşuyor ve
      # yeşil bildiriyor, böylece zorunlu kontrol olarak kullanılabiliyor.
      #
      # Emin olunamayan her durumda testler KOŞAR. Bir değişikliği kaçırmaktansa
      # gereksiz yere birkaç dakika harcamak tercih edilir.
      - name: Veritabanı dosyaları değişti mi
        id: degisiklik
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          calistir() {
            echo "gerekli=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          else
            calistir "Karşılaştırma noktası yok (yeni dal veya ilk push); testler koşuyor."
          fi

          if ! degisen=$(git diff --name-only "$range" 2>/dev/null); then
            calistir "Diff alınamadı; emin olunamadığı için testler koşuyor."
          fi

          if echo "$degisen" | grep -q '^supabase/'; then
            calistir "supabase/ altında değişiklik var; testler koşuyor."
          fi

          echo "gerekli=false" >> "$GITHUB_OUTPUT"
          echo "supabase/ altında değişiklik yok; veritabanı testleri atlanıyor."

      - name: Supabase CLI kurulumu
        if: steps.degisiklik.outputs.gerekli == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0

      - name: Yerel Supabase test ortamını başlat
        if: steps.degisiklik.outputs.gerekli == 'true'
        run: supabase start

      - name: Migration ve pgTAP RLS testleri
        if: steps.degisiklik.outputs.gerekli == 'true'
        run: supabase test db

      # Kimlik mimarisinin tamamı, Supabase'in teslim edilemez alan adlarını
      # (`@orbit.invalid`) kabul etmesine dayanıyor. Bu bir SQL testi olamaz:
      # admin.createUser bir GoTrue API çağrısıdır ve auth.users'a doğrudan
      # INSERT yapmak GoTrue'nun doğrulamasını atlar. Tek seferlik kanıt değil,
      # kalıcı regresyon testidir; Supabase davranışı değiştirirse bunu bir
      # müşteri değil CI bildirir.
      - name: Sentetik e-posta ile giriş kanıtı
        if: steps.degisiklik.outputs.gerekli == 'true'
        run: bash supabase/tests/auth/synthetic_email.sh

      # pgTAP SQL yetkisini ölçüyor, bu adım ZİNCİRİ ölçüyor: HTTP → JWT
      # doğrulaması → Edge Function TypeScript'i → RPC → SQL. Aradaki uyumsuzluk
      # (yanlış parametre adı, değişen imza, bozulan kapı) ne `tsc`'de ne
      # ESLint'te ne pgTAP'te görünüyor — `supabase/functions/` üçünün de
      # kapsamı dışında. İlk kez production'da bir yönetici üye eklemeye
      # çalıştığında ortaya çıkardı.
      - name: Edge Function zincir kanıtı
        if: steps.degisiklik.outputs.gerekli == 'true'
        run: bash supabase/tests/functions/create_member_chain.sh

      - name: Test ortamını kapat
        if: always() && steps.degisiklik.outputs.gerekli == 'true'
        run: supabase stop --no-backup
