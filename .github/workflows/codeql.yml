name: CodeQL

on:
  # Hedef dal filtresi PR tarafında bilinçli olarak yok; bkz. ci.yml'deki aynı
  # not. `branches: [main]` yazıldığında, base'i main olmayan bir PR (yığılı
  # çalışma) hiç taranmıyordu — ci.yml ve supabase-ci.yml bu filtreyi zaten
  # kaldırmıştı, bu dosya o düzeltmeden payını almamıştı (#216).
  push:
    branches: [main]
  pull_request:

# Aynı dala arka arkaya push edildiğinde eskimiş koşumlar sonuna kadar
# çalışıyordu. `main` üzerinde iptal ETMİYORUZ: zorunlu bir kontrolün merge
# edilmiş bir commit'te iptal edilmiş görünmesi, kapıyı "bekliyor" durumunda
# bırakır.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Kod Taraması (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Depoyu Getir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL Başlat
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript

      - name: CodeQL Analizi
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
