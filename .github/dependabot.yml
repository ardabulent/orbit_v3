# Dependabot — bağımlılık ve action sürüm güncellemeleri.
#
# ⚠️ **Bu dosya kendi başına PR açan bir botu yönetiyor.** Değiştiren kişi,
# değişikliğin ilk koşumda ne üreteceğini bilerek değiştirmeli — bkz.
# `.ai/AGENT_WORKFLOW.md` **K-20**.
#
# =========================================================================
# İlk koşumun dersi (2026-09-06)
# =========================================================================
#
# İlk yapılandırma merge edildiği dakika **on PR** açıldı. Ayar tam yazıldığı
# gibi çalışmıştı — `open-pull-requests-limit` **ekosistem başına** uygulanıyor,
# yani beş artı beş. Sorun sayının kendisinde değil, ikisinde birdendi:
#
#   1. **`github-actions` gruplanmamıştı.** Beş action için beş ayrı PR açıldı.
#      Oysa action güncellemeleri neredeyse her zaman mekanik ve birlikte
#      incelenebilir.
#   2. **İlk koşum birikmiş her şeyi döker.** "Haftada bir iki PR" doğru bir
#      cümledir ve ilk gün ne olacağını hiç anlatmaz.
#
# Herkese açık bir depoda on bot PR'ı, deponun bakımsız görünmesine yol açıyor.
#
# =========================================================================
# Botu ne tetikliyor (2026-09-07)
# =========================================================================
#
# "Aylık" takvim, ayda bir kez PR gelir demek DEĞİL. Bot üç ayrı sebeple
# koşuyor ve ikisinin takvimle ilgisi yok:
#
#   1. **Takvim.** Ayda bir, planlanmış koşum.
#   2. **BU DOSYAYA DOKUNMAK.** `.github/dependabot.yml` varsayılan dala
#      merge edildiği an bot yeniden koşar, takvimi beklemez. 2026-09-07
#      gecesi #206 ve #207'nin 02:17'de birden belirmesinin sebebi buydu:
#      #205'in son commit'i (`b157600`) bu dosyaya dokunmuştu ve 02:15'te
#      merge edilmişti. Yani **bu dosyayı düzenlemek, düzenlemenin kendisini
#      test eden bir koşum başlatır.**
#   3. **Boşalan yer.** `open-pull-requests-limit` bir tavan değil, bir
#      **kuyruk**. Açık PR sayısı limitin altına düştüğünde bir sonraki koşum
#      boşalan yerleri kuyruktaki güncellemelerle doldurur. O gece npm tarafı
#      #192 ve #193 merge edilerek iki yer boşaldığı için tam iki PR geldi.
#
# Pratik sonucu: **açık PR'ları bitirmek "sustu" demek değildir.** Kuyruk
# ancak güncellemelerin kendisi tükendiğinde susar; limit yalnızca aynı anda
# kaç tanesini göreceğini belirler.
#
# Güvenlik PR'ları bu üçünün de dışında — bkz. dosyanın sonundaki not.
#
# =========================================================================
# Bu yapılandırmanın hedefi
# =========================================================================
#
# Normal bir ayda **iki PR**: bir gruplu action PR'ı, bir gruplu npm PR'ı.
# Major güncellemeler ayrı kalıyor ve bu bilinçli — bir major'ı grubun içine
# saklamak, onu incelemeden geçirmenin en kolay yolu olurdu.

version: 2
updates:
  # --- GitHub Actions -------------------------------------------------------
  #
  # Tek grupta toplanıyor. Depoda beş action var; hepsi tek PR'da gelirse
  # inceleme yükü artmıyor ama PR sayısı beşte bire iniyor.
  #
  # Major'lar da bu gruba dahil: action major'ları genelde mekanik oluyor
  # (`checkout@v4` → `@v7` gibi) ve CI zaten kırılırsa söylüyor.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # --- npm ------------------------------------------------------------------
  #
  # `patch` ve `minor` tek grupta; `major` ayrı PR'da. Sebep: major bir
  # güncelleme davranış değiştirebilir ve elli paketlik bir grubun içinde
  # fark edilmeden geçebilir. Ayrı geldiğinde adı başlıkta okunuyor.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
# ⚠️ **Güvenlik güncellemeleri bu dosyanın konusu DEĞİL.** Buradaki ayarlar
# rutin sürüm güncellemelerini yönetiyor; bir pakette güvenlik açığı
# bildirildiğinde açılan PR'lar **Dependabot security updates** adlı ayrı bir
# anahtara bağlı ve o anahtar depo ayarlarında duruyor.
#
# Aylık takvime geçmek rutin gürültüyü azaltıyor ve bu ancak o anahtar AÇIKSA
# güvenli: kapalı olsaydı bir güvenlik açığı buradaki takvime düşer ve bir ay
# bekleyebilirdi.
#
# **2026-09-07: anahtar açıldı** (o günkü ekip üyesi). Yani güvenlik açıkları artık bu
# dosyanın takviminden bağımsız, bildirildikleri gün ele alınıyor; buradaki
# "aylık" yalnızca rutin sürüm güncellemelerini yavaşlatıyor. Envanter ve
# doğrulama komutları: `.ai/PLATFORM_SETTINGS.md` bölüm 3.6 ve 6.
#
# Önceki not "doğrulanamadı, `vulnerability-alerts` 404 döndü" diyordu. Sorun
# anahtarda değil **sorduğumuz uç noktadaydı**: o uç nokta `admin` olmayan bir
# çağırana, anahtar açık da olsa kapalı da olsa 404 verir. Doğru soru
# `dependabot/alerts` — kapalıyken 403, açıkken 200 döner ve `push` yetkisi
# yeter.
